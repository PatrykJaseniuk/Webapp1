name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════ Backend (local Supabase) ═══════════════

  backend-check:
    name: Backend Check (supabase db lint + generate types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    outputs:
      types-artifact: database-types
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: supabase start
      - name: Reset database (apply migrations + seed)
        run: supabase db reset
      - name: Lint migrations
        run: supabase db lint
      - name: Generate database types (local)
        run: |
          supabase gen types typescript --local \
            > ../frontend/src/backendConnector/__generated__/database.types.ts
      - name: Upload generated types as artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: frontend/src/backendConnector/__generated__/database.types.ts
          retention-days: 1
      - name: Stop Supabase
        if: always()
        run: supabase stop

  # ═══════════════ Frontend checks ═══════════════

  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    needs: backend-check
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-typecheck:
    name: Frontend Type Check (tsc)
    runs-on: ubuntu-latest
    needs: backend-check
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: database-types
          path: src/backendConnector/__generated__/
      - run: npm ci
      - run: npm run typecheck

  frontend-test:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    needs: backend-check
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: database-types
          path: src/backendConnector/__generated__/
      - run: npm ci
      - run: npm run test

  # ═══════════════ Deploy (push to main only) ═══════════════

  deploy-backend:
    name: Deploy Backend (db push)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - backend-check
      - frontend-lint
      - frontend-typecheck
      - frontend-test
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref ${{ secrets.PRODUCTION_PROJECT_ID }}
      - run: supabase db push

  build-frontend:
    name: Build Frontend (artifact)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: deploy-backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link to production project
        working-directory: backend
        run: supabase link --project-ref ${{ secrets.PRODUCTION_PROJECT_ID }}
      - name: Generate types from production
        working-directory: backend
        run: |
          supabase gen types typescript --linked \
            > ../frontend/src/backendConnector/__generated__/database.types.ts
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7
