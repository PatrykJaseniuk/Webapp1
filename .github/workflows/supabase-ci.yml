name: CI — Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - "backend/supabase/**"
      - ".github/workflows/supabase-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/supabase/migrations/**"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase db lint

  diff-check:
    name: Drift Check
    runs-on: ubuntu-latest
    needs: lint
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref ${{ secrets.PRODUCTION_PROJECT_ID }}
      - name: Check for schema drift
        run: |
          supabase db diff --linked --file drift-check 2>&1 || true
          if [ -s "supabase/migrations/drift-check.sql" ]; then
            echo "⚠️  Schema drift detected between migrations and linked database."
            echo "Apply migrations or update them to match the remote state."
            cat supabase/migrations/drift-check.sql
            exit 1
          fi

  deploy:
    name: Deploy Migrations
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: lint
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref ${{ secrets.PRODUCTION_PROJECT_ID }}
      - run: supabase db push
