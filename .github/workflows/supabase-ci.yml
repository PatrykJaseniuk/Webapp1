name: CI — Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'backend/supabase/**'
      - '.github/workflows/supabase-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/supabase/migrations/**'

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase db lint

  diff-check:
    name: Drift Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Check for schema drift
        run: |
          supabase db diff --linked --file drift-check 2>&1 || true
          if [ -s "supabase/migrations/drift-check.sql" ]; then
            echo "⚠️  Schema drift detected between migrations and linked database."
            echo "Apply migrations or update them to match the remote state."
            cat supabase/migrations/drift-check.sql
            exit 1
          fi